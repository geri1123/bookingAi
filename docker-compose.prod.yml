name: bookingai

# Production/staging compose file. Unlike docker-compose.yml (dev), this
# pulls a pre-built image per service instead of building from source — the
# image was already built and pushed to GHCR by the build-and-push CI
# workflow. Each server only runs the service(s) it's responsible for; see
# DEPLOYMENT.md for how GITHUB_REPOSITORY / IMAGE_TAG / *_ENABLED are set
# per server.
#
# Usage on a server:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# All application env vars are expected to already be exported (e.g. from
# that server's own /opt/bookingai/.env, loaded via --env-file in the
# deploy step) — nothing sensitive is baked into the image.

x-app-defaults: &app-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  api-gateway:
    <<: *app-defaults
    image: ${REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY:-your-org/bookingai}/api-gateway:${IMAGE_TAG:-latest}
    container_name: api-gateway
    ports:
      - "${GATEWAY_PORT:-8000}:${GATEWAY_PORT:-8000}"
    environment:
      PORT: ${GATEWAY_PORT:-8000}
      CORE_SERVICE_URL: ${CORE_SERVICE_URL}
      AI_SERVICE_URL: ${AI_SERVICE_URL}
      COMMUNICATION_SERVICE_URL: ${COMMUNICATION_SERVICE_URL}
      REDIS_URL: ${GATEWAY_REDIS_URL}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS}
      CLIENT_BASE_URL: ${CLIENT_BASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}

  core-service:
    <<: *app-defaults
    image: ${REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY:-your-org/bookingai}/core-service:${IMAGE_TAG:-latest}
    container_name: core-service
    ports:
      - "${CORE_PORT:-8080}:${CORE_PORT:-8080}"
    environment:
      NODE_ENV: production
      PORT: ${CORE_PORT:-8080}
      DATABASE_URL: ${CORE_DATABASE_URL}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX}
      DATABASE_CONNECT_TIMEOUT_MS: ${DATABASE_CONNECT_TIMEOUT_MS}
      DATABASE_IDLE_TIMEOUT_MS: ${DATABASE_IDLE_TIMEOUT_MS}
      OUTBOX_TX_MAX_WAIT_MS: ${OUTBOX_TX_MAX_WAIT_MS}
      OUTBOX_TX_TIMEOUT_MS: ${OUTBOX_TX_TIMEOUT_MS}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL}
      JWT_REFRESH_TTL_DEFAULT: ${JWT_REFRESH_TTL_DEFAULT}
      JWT_REFRESH_TTL_REMEMBER_ME: ${JWT_REFRESH_TTL_REMEMBER_ME}
      CLOUDINARY_URL: ${CLOUDINARY_URL}
      KAFKA_BROKERS: ${CORE_KAFKA_BROKERS}
      CLIENT_BASE_URL: ${CLIENT_BASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}

  ai-service:
    <<: *app-defaults
    image: ${REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY:-your-org/bookingai}/ai-service:${IMAGE_TAG:-latest}
    container_name: ai-service
    ports:
      - "${AI_PORT:-8081}:${AI_PORT:-8081}"
    environment:
      NODE_ENV: production
      PORT: ${AI_PORT:-8081}
      DATABASE_URL: ${AI_DATABASE_URL}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX}
      DATABASE_CONNECT_TIMEOUT_MS: ${DATABASE_CONNECT_TIMEOUT_MS}
      DATABASE_IDLE_TIMEOUT_MS: ${DATABASE_IDLE_TIMEOUT_MS}
      REDIS_URL: ${AI_REDIS_URL}
      KAFKA_BROKER: ${AI_KAFKA_BROKER}
      CORE_SERVICE_URL: ${CORE_SERVICE_URL}
      BILLING_SERVICE_URL: ${BILLING_SERVICE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      DEFAULT_AI_LANGUAGE: ${DEFAULT_AI_LANGUAGE}
      AI_MAX_CONTEXT_MESSAGES: ${AI_MAX_CONTEXT_MESSAGES}
      BUSINESS_INFO_CACHE_TTL_MS: ${BUSINESS_INFO_CACHE_TTL_MS}
      AI_MOCK_MODE: ${AI_MOCK_MODE}

  billing-service:
    <<: *app-defaults
    image: ${REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY:-your-org/bookingai}/billing-service:${IMAGE_TAG:-latest}
    container_name: billing-service
    ports:
      - "${BILLING_PORT:-8083}:${BILLING_PORT:-8083}"
    environment:
      NODE_ENV: production
      PORT: ${BILLING_PORT:-8083}
      DATABASE_URL: ${BILLING_DATABASE_URL}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX}
      DATABASE_CONNECT_TIMEOUT_MS: ${DATABASE_CONNECT_TIMEOUT_MS}
      DATABASE_IDLE_TIMEOUT_MS: ${DATABASE_IDLE_TIMEOUT_MS}
      OUTBOX_TX_MAX_WAIT_MS: ${OUTBOX_TX_MAX_WAIT_MS}
      OUTBOX_TX_TIMEOUT_MS: ${OUTBOX_TX_TIMEOUT_MS}
      KAFKA_BROKER: ${BILLING_KAFKA_BROKER}
      CORE_SERVICE_URL: ${CORE_SERVICE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}

  communication-service:
    <<: *app-defaults
    image: ${REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY:-your-org/bookingai}/communication-service:${IMAGE_TAG:-latest}
    container_name: communication-service
    ports:
      - "${COMMUNICATION_PORT:-8082}:${COMMUNICATION_PORT:-8082}"
    environment:
      NODE_ENV: production
      PORT: ${COMMUNICATION_PORT:-8082}
      DATABASE_URL: ${COMMUNICATION_DATABASE_URL}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX}
      DATABASE_CONNECT_TIMEOUT_MS: ${DATABASE_CONNECT_TIMEOUT_MS}
      DATABASE_IDLE_TIMEOUT_MS: ${DATABASE_IDLE_TIMEOUT_MS}
      REDIS_URL: ${COMMUNICATION_REDIS_URL}
      KAFKA_BROKERS: ${COMMUNICATION_KAFKA_BROKERS}
      CORE_SERVICE_URL: ${CORE_SERVICE_URL}
      AI_SERVICE_URL: ${AI_SERVICE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      META_APP_ID: ${META_APP_ID}
      META_APP_SECRET: ${META_APP_SECRET}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN}

  notification-service:
    <<: *app-defaults
    image: ${REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY:-your-org/bookingai}/notification-service:${IMAGE_TAG:-latest}
    container_name: notification-service
    ports:
      - "${NOTIFICATION_PORT:-8084}:${NOTIFICATION_PORT:-8084}"
    environment:
      NODE_ENV: production
      PORT: ${NOTIFICATION_PORT:-8084}
      KAFKA_BROKERS: ${NOTIFICATION_KAFKA_BROKERS}
      REDIS_URL: ${NOTIFICATION_REDIS_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      CLIENT_BASE_URL: ${CLIENT_BASE_URL}
